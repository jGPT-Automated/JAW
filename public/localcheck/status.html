<header><a class="jaw-back" href="/command">← JAW</a><a href="index.html"><strong>LocalCheck / Working file</strong></a><nav><a href="index.html">Home &amp; Court</a><a href="challenge.html">Challenge &amp; OTA</a><a href="roadmap.html">Roadmap &amp; decisions</a><a href="screens.html">Screens</a><a href="audit.html">PR77 audit</a><a href="status.html">Status &amp; docs</a></nav></header>
<main>
<p class="eyebrow">Expo UI / App Store / tracking</p>
<h1>What is done.<br>What is proven.</h1>
<p class="lead" id="summary">Loading status…</p>
<noscript><p class="notice">This page reads data/status.json with JavaScript. The same data is in <a href="data/status.json">data/status.json</a>.</p></noscript>
<section id="needs"><h2>Needs you</h2><div id="needs-list"></div></section>
<section id="tracks"><h2>Workstreams</h2><div class="cards" id="track-cards"></div></section>
<section id="prs"><h2>Pull requests</h2><div class="tablewrap"><table><tr><th>Track</th><th>PR</th><th>State</th><th>Evidence</th></tr><tbody id="pr-rows"></tbody></table></div></section>
<section id="legend"><h2>How to read status</h2><div id="legend-list"></div></section>
<section id="log"><h2>Update log</h2><div id="log-list"></div></section>
</main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag=s=>`<span class="status s-${esc(s)}">${esc(s.replace("-"," ").toUpperCase())}</span>`;
fetch("data/status.json").then(r=>r.json()).then(d=>{
  document.getElementById("summary").textContent=d.summary+" Updated "+d.updated+".";
  document.getElementById("needs-list").innerHTML=d.needs_you.map(n=>`<div class="notice">${tag(n.status)} ${esc(n.text)}${n.note?`<div class="muted">${esc(n.note)}</div>`:""}</div>`).join("");
  document.getElementById("track-cards").innerHTML=d.tracks.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.repo)} · ${esc(t.state)}</p><ul class="steps">${t.steps.map(s=>`<li><span class="t">${esc(s.text)}${s.note?`<div class="muted">${esc(s.note)}</div>`:""}</span>${tag(s.status)}</li>`).join("")}</ul></div>`).join("");
  const rows=d.tracks.flatMap(t=>t.prs.map(p=>`<tr><td>${esc(t.name)}</td><td><a href="${esc(p.url)}">${esc(p.title)}</a></td><td>${esc(p.state)}</td><td>${esc(p.evidence||"")}</td></tr>`));
  document.getElementById("pr-rows").innerHTML=rows.join("")||`<tr><td colspan="4" class="muted">No pull requests reported yet.</td></tr>`;
  document.getElementById("legend-list").innerHTML=Object.entries(d.legend).map(([k,v])=>`<p>${tag(k)} ${esc(v)}</p>`).join("");
  document.getElementById("log-list").innerHTML=d.log.map(l=>`<p><b>${esc(l.date)}</b> · ${esc(l.text)}</p>`).join("");
}).catch(()=>{document.getElementById("summary").textContent="Could not load data/status.json."});
</script>
