# Deploys the JAW voice agent (agent/) to LiveKit Cloud from GitHub, so no local machine is needed.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET  LiveKit Cloud project keys
#   SECRET_LIST  must contain JAW's agent token (jaw_...). The workflow finds it in whatever
#                is pasted there and adds JAW_API_URL itself, so the exact format doesn't matter.
#
# First time: Actions → "Voice agent" → Run workflow → operation "create". It creates the agent,
# deploys it, and opens a PR adding agent/livekit.toml. Merge that PR. After that, every push to
# main that changes agent/ deploys a new version (or run the workflow with "deploy").
name: Voice agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: create (first time) or deploy
        required: true
        type: choice
        options: [create, deploy]
        default: create
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/livekit.toml"
      - "!agent/**/*.md"

concurrency:
  group: voice-agent
  cancel-in-progress: true

jobs:
  create:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'create'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Build the agent's settings from SECRET_LIST, tolerant of how it was pasted: take the
      # jaw_... token wherever it appears and add the (public) app address.
      - name: Prepare agent settings
        id: settings
        env:
          RAW: ${{ secrets.SECRET_LIST }}
          RAW_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          # The deploy tool calls LiveKit over HTTPS; the stored URL is the wss:// one apps use.
          url=$(printf '%s' "$RAW_URL" | sed -e 's#^wss://#https://#' -e 's#^ws://#http://#')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          token=$(printf '%s' "$RAW" | grep -oE 'jaw_[0-9a-f]{48}' | head -n1)
          if [ -z "$token" ]; then
            echo "::error::SECRET_LIST doesn't contain JAW's agent token (starts with jaw_)."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "list=JAW_API_URL=https://jaw-three.vercel.app,JAW_AGENT_TOKEN=$token" >> "$GITHUB_OUTPUT"
      - name: Create the agent on LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ steps.settings.outputs.url }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ steps.settings.outputs.list }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: agent
      - name: Open a PR with agent/livekit.toml
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: agent/livekit.toml
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: voice-agent-config-${{ github.run_id }}
          title: Add LiveKit voice agent config
          commit-message: Add LiveKit voice agent config
          body: Created by the Voice agent workflow. Merge so later pushes deploy to this agent.
          base: main
          delete-branch: true
      - uses: actions/checkout@v4
        with:
          ref: voice-agent-config-${{ github.run_id }}
      - name: Wait until the agent is running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ steps.settings.outputs.url }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: agent
          TIMEOUT: 10m

  deploy:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until "create" has run and its PR is merged there is no agent to deploy to.
      # Build the agent's settings from SECRET_LIST, tolerant of how it was pasted: take the
      # jaw_... token wherever it appears and add the (public) app address.
      - name: Prepare agent settings
        if: hashFiles('agent/livekit.toml') != ''
        id: settings
        env:
          RAW: ${{ secrets.SECRET_LIST }}
          RAW_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          # The deploy tool calls LiveKit over HTTPS; the stored URL is the wss:// one apps use.
          url=$(printf '%s' "$RAW_URL" | sed -e 's#^wss://#https://#' -e 's#^ws://#http://#')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          token=$(printf '%s' "$RAW" | grep -oE 'jaw_[0-9a-f]{48}' | head -n1)
          if [ -z "$token" ]; then
            echo "::error::SECRET_LIST doesn't contain JAW's agent token (starts with jaw_)."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "list=JAW_API_URL=https://jaw-three.vercel.app,JAW_AGENT_TOKEN=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy a new version
        if: hashFiles('agent/livekit.toml') != ''
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ steps.settings.outputs.url }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ steps.settings.outputs.list }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent
